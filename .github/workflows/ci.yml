# Every push and pull request: typecheck, build, the content round-trip, and
# the full test suite (API, database, headless Chrome) against a real
# PostgreSQL. `main` requires this job ("checks") to pass, and Railway's
# "Wait for CI" holds each deploy until it has.
#
# Docs-only changes skip the heavy steps, but the job itself always runs and
# passes, so the required "checks" status still reports. (A workflow-level
# `paths-ignore` would leave that required check waiting forever, blocking the
# merge.) What counts as docs is decided in the "Docs only?" step below.
name: CI

on:
  # Pushes to main: the run Railway's "Wait for CI" waits for before deploying.
  push:
    branches: [main]
  # Everything else is checked through its pull request, once per update.
  pull_request:

# One run at a time per pull request (or per branch for pushes). A newer push to a
# pull request cancels the run it replaces. On main nothing is cancelled: each merge
# is a deploy that "Wait for CI" holds for its own run, and merges are one at a time.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Catches a hang the test runner's own limits don't (60 s a test, 10 min a file:
    # scripts/run-tests.mjs). The tests took about 26 min in November 2026 on the public
    # repo's 4-core runner; a private repo's ubuntu-latest has 2 cores, so the suite is
    # expected to run longer there.
    timeout-minutes: 50

    # PostgreSQL is not a `services:` container: those are pulled before any step runs,
    # so a registry's pull limit failed the job before any code ran (Docker Hub on #24,
    # public.ecr.aws "Data limit exceeded" on #73). The "Postgres" steps below load the
    # image from the Actions cache instead, and pull it only on a cache miss.
    env:
      # The official postgres:18 image (18.7, Debian 13) pinned by its multi-arch index
      # digest, which Docker Hub, public.ecr.aws and mirror.gcr.io all serve unchanged.
      # Keep the major version in step with production (docs/LAUNCH-CHECKLIST.md,
      # item 5). To update: read the new digest of `postgres:18` (any of the three
      # registries), and change it here; the cache key follows it.
      PG_IMAGE_DIGEST: sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
      # Satisfies the test guard: localhost, an explicit port, a *_test database.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/site_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/site_test
      # No R2 or Resend here: the tests clear those variables and use fakes.

    steps:
      - uses: actions/checkout@v4
        with:
          # The visual test compares InquiryModal against an older commit, and
          # "Docs only?" compares this commit with the one before it.
          fetch-depth: 0

      # Docs only: every changed file is Markdown at the top level (README.md,
      # CLAUDE.md) or under docs/, except docs/screenshots/ (no-committed-images
      # guards that folder, so a change there runs everything). A pull request is
      # judged by its whole diff (its merge commit against the base), a push to main
      # by everything since the previous push. Anything unclear runs every check.
      - name: Docs only?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then from=HEAD^1; else from="$BEFORE"; fi
          if ! files=$(git diff --name-only "$from" HEAD 2>/dev/null) || [ -z "$files" ]; then
            echo "Can't tell what changed, so every check runs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r f; do
            case "$f" in
              docs/screenshots/*) code=true ;;
              docs/*) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "$(printf '%s\n' "$files" | wc -l) files changed; code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Docs-only change, so the checks below are skipped
        if: steps.changes.outputs.code != 'true'
        run: echo "Only documentation changed. Typecheck, build, verify:roundtrip and the tests are skipped."

      # The image as a `docker save` tarball, keyed by its digest: a new digest is a new
      # key, so a stale image is never loaded. Restore and save are separate steps, so
      # a pull is cached straight away, even when a later check fails. Caches made on
      # a pull request stay with it; the first run on main makes the one every branch
      # can use. No login or secret anywhere.
      - name: Postgres image (cache)
        id: pg-cache
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/postgres-image.tar
          key: postgres-image-${{ runner.os }}-${{ env.PG_IMAGE_DIGEST }}

      - name: Postgres image (load from the cache)
        if: steps.changes.outputs.code == 'true' && steps.pg-cache.outputs.cache-hit == 'true'
        run: docker load --input "$RUNNER_TEMP/postgres-image.tar"

      # On a miss: the same digest from three registries in turn, three rounds, waiting
      # longer between rounds. Pulling by digest means whichever registry answers, the
      # image is byte for byte the same.
      - name: Postgres image (pull on a cache miss)
        if: steps.changes.outputs.code == 'true' && steps.pg-cache.outputs.cache-hit != 'true'
        run: |
          for round in 1 2 3; do
            for registry in public.ecr.aws/docker/library mirror.gcr.io/library docker.io/library; do
              ref="$registry/postgres@$PG_IMAGE_DIGEST"
              if docker pull --quiet "$ref"; then
                docker tag "$ref" ci-postgres:pinned
                docker save --output "$RUNNER_TEMP/postgres-image.tar" ci-postgres:pinned
                echo "Pulled from $registry (round $round)."
                exit 0
              fi
              echo "::warning::Pull from $registry failed (round $round)."
            done
            sleep $((round * 30))
          done
          echo "::error::Couldn't pull postgres@$PG_IMAGE_DIGEST from any registry."
          exit 1

      - name: Postgres image (save to the cache)
        if: steps.changes.outputs.code == 'true' && steps.pg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/postgres-image.tar
          key: postgres-image-${{ runner.os }}-${{ env.PG_IMAGE_DIGEST }}

      # Readiness is checked over TCP inside the container: while the image initialises
      # the database it runs a temporary server on the Unix socket only, so a plain
      # `pg_isready` could pass before the real server is up.
      - name: Postgres (start)
        if: steps.changes.outputs.code == 'true'
        run: |
          docker run --detach --name postgres \
            --env POSTGRES_PASSWORD=postgres --env POSTGRES_DB=site_test \
            --publish 5432:5432 ci-postgres:pinned
          for i in $(seq 1 60); do
            if docker exec postgres pg_isready --host 127.0.0.1 --username postgres --dbname site_test >/dev/null 2>&1; then
              docker exec postgres psql --username postgres --tuples-only --command 'select version()'
              exit 0
            fi
            sleep 1
          done
          docker logs postgres
          echo "::error::Postgres didn't become ready in 60 s."
          exit 1

      # ~/.npm is cached, keyed on package-lock.json (npm ci took 4 s with it).
      # Chrome needs no cache: the tests use the runner image's /usr/bin/google-chrome.
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.changes.outputs.code == 'true'
        run: npm ci
      - if: steps.changes.outputs.code == 'true'
        run: npm run typecheck
      # Before the tests: the browser tests load the built client.
      - if: steps.changes.outputs.code == 'true'
        run: npm run build
      - if: steps.changes.outputs.code == 'true'
        run: npm run verify:roundtrip
      - if: steps.changes.outputs.code == 'true'
        run: npm test
