<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The light or dark theme, set before the first paint (classic, blocking,
         same-origin: no inline script). Keep it above the stylesheets. -->
    <script src="/theme-init.js"></script>
    <!-- Express replaces everything between these markers with each page's own
         title, description, canonical URL and share tags (server/src/pages).
         The defaults come from shared/page-meta.ts, filled in by Vite. -->
    <!--page-meta-->
    <title>%HOME_TITLE%</title>
    <meta name="description" content="%HOME_DESCRIPTION%" />
    <!--/page-meta-->
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Leaflet's stylesheet is loaded by src/lib/leaflet.ts, only on pages with a map. -->
  </head>
  <body class="bg-[var(--background)] text-[var(--text-primary)] font-sans antialiased selection:bg-[var(--brand-secondary)] selection:text-[var(--on-secondary)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
